<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_prof_zara_haddad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5F6D" />
      <stop offset="100%" stop-color="#FFC371" />
    </linearGradient>
    <linearGradient id="overlayGrad_prof_zara_haddad" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(15,17,21,0.95)" />
    </linearGradient>
    <filter id="shadow_prof_zara_haddad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#bgGrad_prof_zara_haddad)" />

  <!-- Subtle geometric accent shapes in background -->
  <circle cx="340" cy="80" r="90" fill="white" opacity="0.12" />
  <circle cx="60" cy="380" r="120" fill="white" opacity="0.08" />
  <path d="M-20,150 Q100,50 250,160 T450,140" fill="none" stroke="white" stroke-width="2" opacity="0.15" />

  <!-- Portrait Silhouette Group with Shadow -->
  <g filter="url(#shadow_prof_zara_haddad)">
    <!-- Body / Torso -->
    <path d="M90,500 C90,410 120,365 200,365 C280,365 310,410 310,500 Z" fill="#4A90E2" />
    <!-- Neck -->
    <rect x="175" y="305" width="50" height="75" rx="10" fill="#F8D9C0" />
    <!-- Head Base -->
    <ellipse cx="200" cy="235" rx="65" ry="80" fill="#F8D9C0" />

    <!-- Hair Silhouette (Stylized) -->
    <path d="M130,240 C120,150 160,120 200,120 C240,120 280,150 270,240 C280,310 270,390 260,420 C245,420 250,340 245,280 C240,230 230,150 200,150 C170,150 160,230 155,280 C150,340 155,420 140,420 C130,390 120,310 130,240 Z" fill="#2C1B18" />

    <!-- Eyes (Minimalist modern aesthetic) -->
    <circle cx="178" cy="232" r="5" fill="#1A1A1A" />
    <circle cx="222" cy="232" r="5" fill="#1A1A1A" />
    <!-- Cheerful Expression / Smile -->
    <path d="M188,266 Q200,278 212,266" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" />
    <!-- Blushing cheeks -->
    <circle cx="168" cy="250" r="10" fill="#FF5252" opacity="0.3" />
    <circle cx="232" cy="250" r="10" fill="#FF5252" opacity="0.3" />

    <!-- Eyebrows -->
    <path d="M170,220 Q180,214 190,219" fill="none" stroke="#2C1B18" stroke-width="2.5" stroke-linecap="round" />
    <path d="M210,219 Q220,214 230,220" fill="none" stroke="#2C1B18" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Initials Badge in Top-Right -->
  <g transform="translate(325, 25)">
    <circle cx="20" cy="20" r="20" fill="rgba(0,0,0,0.3)" />
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="1">ZH</text>
  </g>

  <!-- Bottom Dark Gradient for Text Legibility -->
  <rect y="250" width="400" height="250" fill="url(#overlayGrad_prof_zara_haddad)" />
</svg>